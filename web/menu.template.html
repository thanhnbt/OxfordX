<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#26395a">
<title>Little Explorer · Choose a Unit</title>
<style>
:root{color-scheme:light;--ink:#26395a;--muted:#63708a;--paper:#faf8f3;--line:#e5e5e9;--blue:#4961b6;--soft:#eef0fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#e7edf9 0,transparent 38%),radial-gradient(ellipse at 92% 88%,#f8e9d5 0,transparent 35%),var(--paper);color:var(--ink);font:17px/1.5 "Segoe UI",Arial,sans-serif}.shell{max-width:1040px;margin:auto;padding:48px 26px 60px}.masthead{display:flex;align-items:center;gap:13px}.mark{width:44px;height:44px;border-radius:13px;background:var(--ink);color:#f7d79c;display:grid;place-items:center;font-size:24px}.brand{font-size:20px;font-weight:800}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.6px;text-transform:uppercase}.eyebrow{margin:62px 0 8px;color:#9b612a;font-size:12px;font-weight:800;letter-spacing:1.6px}h1{max-width:700px;margin:0;font-size:clamp(35px,5vw,56px);line-height:1.08;letter-spacing:0} .intro{margin:15px 0 32px;color:var(--muted);font-size:18px}.unit-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.unit-link{min-height:220px;display:flex;flex-direction:column;justify-content:space-between;padding:22px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:7px;color:inherit;text-decoration:none;box-shadow:0 8px 28px #24365709;transition:transform .18s ease,box-shadow .18s ease}.unit-link:hover{transform:translateY(-3px);box-shadow:0 12px 30px #24365715}.unit-number{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--accent)}.unit-link h2{margin:12px 0 5px;font-size:23px;line-height:1.2}.unit-link p{margin:0;color:var(--muted)}.open{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font-weight:750}.footer{margin-top:30px;color:var(--muted);font-size:13px}@media(max-width:700px){.shell{padding:28px 18px}.eyebrow{margin-top:42px}.unit-list{grid-template-columns:1fr}.unit-link{min-height:160px}.intro{font-size:16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(min-width:701px){h1{font-size:56px}}@media(max-width:700px){h1{font-size:38px}}.unit-link{padding:0;overflow:hidden;min-height:250px}.unit-visual{display:block;width:100%;height:96px;object-fit:cover;background:#edf0f6}.unit-copy{padding:12px 18px 0}.open{margin:14px 18px 16px}@media(max-width:700px){.unit-link{min-height:210px}}
</style>
</head>
<body>
<main class="shell">
<header class="masthead"><div class="mark" aria-hidden="true">✦</div><div class="brand">Little Explorer<small>Oxford Discover 4 · Grade 4 ESL</small></div></header>
<p class="eyebrow">THREE UNITS · ONE BIG JOURNEY</p>
<h1>What would you like to explore?</h1>
<p class="intro">Choose a unit to open its self-contained lesson.</p>
<nav class="unit-list" aria-label="Choose a unit">__UNIT_LINKS__</nav>
<footer class="footer">Little Explorer · Units 1–3</footer>
</main>
</body>
</html>
